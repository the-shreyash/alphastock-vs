  - id: GHSA-fxqj-rqcc-2cmp
    ecosystem: npm
    package: postcss
    affected: "7.0.39"
    severity: high
    classification: not-reachable
    reason: Incomplete fix of GHSA-6g55-p6wh-862q.
    reachability: Same nested postcss@7 path as GHSA-7fh5-64p2-3v2j.
    evidence: 'npm ls postcss --all'
    mitigation: Same as GHSA-6g55-p6wh-862q.
    fixed_in: "8.5.22 (not applicable to the 7.x line)"
    blocked_by: "react-scripts@5.0.1 → resolve-url-loader@4.0.0"
    owner: frontend
    expires: "2026-11-15"

  - id: GHSA-r28c-9q8g-f849
    ecosystem: npm
    package: postcss
    affected: "7.0.39"
    severity: high
    classification: not-reachable
    reason: Path traversal in previous-source-map auto-loading.
