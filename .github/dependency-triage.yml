  - id: "via:build-chain"
    ecosystem: npm
    package: react-scripts
    affected: ">=0.1.0"
    severity: high
    classification: not-reachable
    reason: >-
      The Create React App build toolchain itself, flagged because it depends on
      @svgr/webpack, css-minimizer-webpack-plugin, jest, resolve-url-loader,
      webpack-dev-server and workbox-webpack-plugin.
    reachability: >-
      react-scripts is the build system. It runs on a developer machine or a CI
      runner and is never installed into a production image or served to a
      browser. It appears under `dependencies` rather than `devDependencies`
      because that is Create React App's own layout — which is also why
      `npm audit --omit=dev` does not filter this group, and why reachability
      here is argued from the dependency graph and the shipped bundle instead.
    evidence: >-
      grep -rE "from 'react-scripts'" frontend/src/ → 0 matches;
      the production image contains no node_modules (backend/Dockerfile);
      grep -r "webpack-dev-server\|sockjs" frontend/build/static/js/ → 0 matches
    mitigation: >-
      Not deployed. The only artifact that reaches a user is the contents of
      frontend/build/.
    fixed_in: "none — npm reports the fix as react-scripts@0.0.0 (removal)"
    blocked_by: >-
      Migrating off Create React App (to Vite or an equivalent) is a roadmap
      item carried from PH2 H5 / PH3.10 P2-4. It replaces the entire build
      pipeline and needs its own sprint and regression pass.
    owner: frontend
    expires: "2026-11-15"
