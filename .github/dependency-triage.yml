    fixed_in: "8.5.10 (not applicable to the 7.x line)"
    blocked_by: "react-scripts@5.0.1 → resolve-url-loader@4.0.0"
    owner: frontend
    expires: "2026-11-15"

  - id: GHSA-6g55-p6wh-862q
