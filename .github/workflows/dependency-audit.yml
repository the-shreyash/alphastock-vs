# ==============================================================================
# StockAssist AI — Supply-chain audit (PH2.4; gate rebuilt in PH3.11)
#
# WHAT PROBLEM THIS SOLVES
# ------------------------
# Most of the code shipped to production was not written by this team. The
# backend pins ~120 Python packages and the frontend pulls a far larger npm
# tree; a vulnerability in any of them is a vulnerability in StockAssist AI, and
# the customer will not care whose repository it came from.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM backend-ci.yml
# ---------------------------------------------------
# Because it is the one class of check whose result changes WITHOUT the code
# changing. A commit-triggered pipeline answers "is this change safe?". That
# question is necessary and insufficient: a dependency set that was clean on
# Monday is vulnerable on Thursday because an advisory was published, not
# because anyone pushed. Hence the weekly `schedule:` trigger — the single most
# important line in this file, and the reason these jobs do not simply live
# inside backend-ci.yml.
#
# ── WHAT PH3.11 CHANGED, AND WHY ──────────────────────────────────────────────
#
# This gate was red on BOTH jobs, and had been for some time with nobody
# recording it. PH3.10 reported CI/CD as passing after adding `frontend-ci`,
# because it never ran this workflow. Three separate defects, each fixed here:
#
# 1. **The npm job could not be satisfied.** It was a bare
#    `npm audit --audit-level=high` with no suppression mechanism of any kind,
#    failing on 18 advisories in the Create React App build chain that are not
#    reachable and never reach a browser. A gate that cannot be satisfied is a
#    gate the team routes around.
#
# 2. **The Python suppressions rotted silently.** Eight of the fifteen
#    `--ignore-vuln` flags named `litellm` and `ecdsa` — packages already
#    REMOVED from requirements.txt. They suppressed nothing, and nothing checked
#    that a suppression still matched a live finding.
#
# 3. **The dev-requirements step contradicted the runtime step.** It ran
#    pip-audit with NO suppressions, over `requirements-dev.txt`, which begins
#    `-r requirements.txt` — so it re-audited every runtime package and failed
#    on the very advisories the runtime step had deliberately accepted. The
#    comment claiming "no suppressions here, and none should ever be needed"
#    described a file that transitively includes the entire runtime set.
#
# Both ecosystems now run through `.github/scripts/dependency_audit.py`, which evaluates
# every finding against `.github/dependency-triage.yml`. The auditors are
# invoked with NO ignore flags: the register decides what is acceptable, and the
# register is enforced — expired entries fail, untriaged findings fail, and an
# entry that stops matching a real finding fails so it cannot rot the way the
# litellm/ecdsa flags did.
#
# RELATIONSHIP TO THE REST OF THE SUPPLY-CHAIN CONTROLS
#   * .github/dependabot.yml     — opens the PR that FIXES a finding
#   * this workflow              — DETECTS the finding and blocks the merge
#   * security-audit.yml         — secret hygiene (gitleaks, config drift)
#   * backend-ci.yml `build` job — dependency-graph consistency (`pip check`)
#
# TRIAGE POLICY (authoritative copy: .claude/SECRETS.md §7-8)
#   Critical → immediate, blocks merge and release
#   High     → 7 days, else a recorded register entry with evidence and expiry
#   Medium   → 30 days      Low → 90 days
#
# Full documentation: docs/deployment/GITHUB_ACTIONS.md §7
# ==============================================================================
name: dependency-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC. Deliberately early in the week: a finding surfaced on a
    # Monday morning has five working days of runway before it becomes a
    # weekend problem.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned like everything else. An unpinned security tool is an unpinned
  # dependency holding root over the build's verdict.
  PIP_AUDIT_VERSION: "2.7.3"
  PYYAML_VERSION: "6.0.2"

jobs:
  # ---------------------------------------------------------------------------
  # Python — pip-audit against the pinned requirement files, judged by the
  # register.
  #
  # pip-audit resolves the pinned set against the Python Packaging Advisory
  # Database and the OSV feed. It reads the requirements files directly: no
  # installation, no virtualenv, and no arbitrary setup.py execution from a
  # package that may itself be the problem.
  #
  # `--strict` (applied inside the script) is what makes this a gate rather than
  # a report. Without it, pip-audit exits 0 when it merely FAILS TO RESOLVE a
  # package — so a typo, a yanked release or a registry outage would present as
  # a clean audit. Silent success is the worst possible failure mode for a
  # security check.
  #
  # Both requirements.txt and requirements-dev.txt are audited in one pass.
  # Findings are de-duplicated because the dev file starts with
  # `-r requirements.txt`; that overlap is exactly what made the old two-step
  # arrangement self-contradictory.
  # ---------------------------------------------------------------------------
  backend-advisories:
    name: Backend dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install audit tooling
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}" "pyyaml==${PYYAML_VERSION}"

      - name: Audit Python dependencies against the triage register
        # No `| tail`, no `|| true`. The script's exit code is the job's exit
        # code — 0 clean, 1 policy violation, 2 the audit could not run. The
        # third is distinct on purpose: "the check could not be performed" must
        # never be reported as "the check passed".
        run: python .github/scripts/dependency_audit.py --ecosystem python --summary "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # JavaScript — npm audit against the lockfile, judged by the same register.
  #
  # `--legacy-peer-deps` is required and is not laziness: the project pins
  # eslint 9 while `eslint-config-react-app@7.0.1` peer-requires eslint 8, so
  # strict peer resolution cannot install this tree. `frontend-ci.yml` uses the
  # same flag for the same reason.
  # ---------------------------------------------------------------------------
  frontend-advisories:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install audit tooling
        run: python -m pip install "pyyaml==${PYYAML_VERSION}"

      - name: Install frontend dependencies from the lockfile
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Audit npm dependencies against the triage register
        run: python .github/scripts/dependency_audit.py --ecosystem npm --summary "$GITHUB_STEP_SUMMARY"

      - name: Report the full advisory picture (advisory, never fails)
        # Its job is to keep the moderate/low backlog visible so deferring stays
        # a decision rather than an oversight. This step is allowed to fail
        # without failing the job — and is the ONLY step here of which that is
        # true.
        if: always()
        continue-on-error: true
        working-directory: frontend
        run: |
          set -uo pipefail
          npm audit --json > audit.json 2>/dev/null || true
          node -e '
            let a = {};
            try { a = require("./audit.json").metadata.vulnerabilities || {}; } catch (e) {}
            const row = ["critical","high","moderate","low","info"]
              .map(k => `${k}: ${a[k] ?? 0}`).join(" · ");
            console.log(`### Frontend advisory backlog\n\n${row}\n`);
          ' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Aggregate gate — one stable check name for branch protection (PH2.5).
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-advisories, frontend-advisories]
    if: always()
    steps:
      - name: Verify every required job succeeded
        run: |
          set -euo pipefail
          backend='${{ needs.backend-advisories.result }}'
          frontend='${{ needs.frontend-advisories.result }}'
          printf 'backend=%s frontend=%s\n' "$backend" "$frontend"
          for r in "$backend" "$frontend"; do
            [ "$r" = "success" ] || {
              echo "::error::dependency-audit gate failed — see the job summary. Triage register: .github/dependency-triage.yml; policy: .claude/SECRETS.md §7-8."
              exit 1
            }
          done
          echo "✓ every advisory is fixed or covered by an unexpired, evidenced register entry"
