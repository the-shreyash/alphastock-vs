# ==============================================================================
# StockAssist AI — Secret & configuration hygiene (PH1.9, re-scoped in PH2.4)
#
# WHAT THIS WORKFLOW OWNS
# -----------------------
# The two ways a repository leaks or lies about its own configuration:
#   * a credential committed to git history, and
#   * a configuration template that no longer matches the code reading it.
#
# WHAT MOVED OUT IN PH2.4, AND WHY IT IS NOT HERE ANY MORE
#   * pip-audit / npm audit  → .github/workflows/dependency-audit.yml
#   * `pip check`            → backend-ci.yml `build` job, which installs the
#                              runtime dependency set anyway (the shared
#                              composite action runs `pip check` on every job)
# Running either in two workflows would double the runner cost and — far worse —
# create two places to edit a triage policy, which is exactly how two copies
# start disagreeing. One check, one owner.
#
# WHY THIS IS STILL A SEPARATE WORKFLOW FROM backend-ci.yml
# ---------------------------------------------------------
# `secret-scan` needs `fetch-depth: 0` — the FULL git history, because a
# credential deleted in a later commit is still a credential anyone can read out
# of the object store. Every other job in the pipeline wants a shallow clone for
# speed. Isolating the deep-clone job keeps the rest of CI fast.
#
# Related: .claude/SECRETS.md (inventory, rotation, incident runbook),
#          docs/deployment/GITHUB_ACTIONS.md §7
# ==============================================================================
name: security-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC. gitleaks ships new detection rules regularly, so old
    # history is worth re-scanning even when nothing was pushed.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so a secret in any past commit is caught

      - name: Guard — no .env file may be tracked
        # A cheap, deterministic check that runs before the probabilistic one.
        # gitleaks matches on entropy and known patterns and can miss a
        # hand-written value; a tracked `.env` is unambiguous, and it is by far
        # the most common way a real credential enters a repository.
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(?!example)'; then
            echo "::error::A real .env file is tracked. Remove it and rotate the secrets."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Run gitleaks
        # Test fixtures that contain deliberately fake-but-realistic credentials
        # carry an inline `# gitleaks:allow`. That is the right way to silence a
        # true-positive-shaped false positive: the exemption sits on the line it
        # exempts, where a reviewer reading that line cannot miss it — never as
        # a broad path exclusion, which would also hide a real leak added to the
        # same file later.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  config-sync:
    name: Config template in sync with registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The shared composite action rather than a bare `setup-python` + `pip
      # install`: the generator imports security/secrets.py, which imports the
      # application's own dependencies, so this job needs the full runtime set —
      # and it gets the cached virtualenv for free, turning a ~2 minute install
      # into a ~10 second restore.
      - uses: ./.github/actions/setup-backend
        with:
          python-version: "3.11"
          requirements: runtime

      - name: backend/.env.example matches security/secrets.py
        # Documentation drift is a security problem, not a tidiness problem: an
        # operator provisioning a new environment from a stale template ships
        # without a variable the code now requires, and finds out in production.
        working-directory: backend
        run: python scripts/generate_env_example.py --check
