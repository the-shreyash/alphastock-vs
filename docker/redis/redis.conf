# ==============================================================================
# StockAssist AI — Production Redis configuration (PH2.7)
#
# WHY THIS FILE EXISTS AT ALL
# ---------------------------
# PH2.2 configured Redis with six `--flag value` pairs on the compose `command:`
# list, and the rationale written there was sound for six settings: everything
# was visible next to the comment explaining it. Production tuning needs roughly
# thirty, and thirty flags in a YAML list is no longer readable — it is a wall of
# strings where a typo in `--maxmemory-polciy` starts Redis with the DEFAULT
# policy and no error, because redis-server treats an unknown flag on the command
# line as a fatal error but a *misspelled value* silently is not. Worse, the
# settings would have to be duplicated across docker-compose.yml and
# docker-compose.secrets.yml, and two copies of a tuning decision drift.
#
# So: one authoritative file, mounted read-only into the container, shared by
# every compose overlay. Two things are deliberately NOT in it —
#
#   requirepass         a credential; it stays out of the git repository and is
#                       supplied on the command line (base stack) or read from a
#                       Docker secret at container start (secrets overlay).
#   maxmemory / policy  per-environment sizing; supplied from .env so a laptop
#                       and a production host can differ without editing a
#                       tracked file.
#
# Both are passed AFTER this file's path on the redis-server command line, and
# later arguments override the config file. That precedence is the whole reason
# this split works — see docker-compose.yml.
#
# HOW TO VERIFY WHAT IS ACTUALLY RUNNING (never trust this file alone):
#     docker compose exec redis redis-cli CONFIG GET maxmemory-policy
#     docker compose exec redis redis-cli INFO persistence
#
# Full documentation and the reasoning behind every value: docs/infrastructure/REDIS.md
# ==============================================================================

# ──────────────────────────────────────────────────────────────────────────────
# NETWORK & SECURITY
# ──────────────────────────────────────────────────────────────────────────────

# No `bind` directive, on purpose.
#
# The instinct is to write `bind 127.0.0.1`, and it is wrong here: inside a
# container 127.0.0.1 is the container's OWN loopback, so the backend container
# could not reach it and the stack would not start. The isolation that a `bind`
# line provides on a bare host is provided here by the network topology instead —
# the `data` network is declared `internal: true`, which removes its gateway
# entirely, and the redis service publishes no ports. Redis listening on all
# interfaces *of a network namespace that has no route to or from the internet*
# is not an exposure.
#
# If this Redis is ever moved onto a host network or given a published port, add
# a `bind` line in the same commit. Do not rely on this comment being read.

# Refuse connections from outside the loopback when NO password and NO bind
# directive are configured. With `requirepass` supplied on the command line this
# is technically redundant — but it is the seatbelt for the day someone
# "temporarily" removes the password to debug something. Redis's default is yes;
# stating it means a future edit has to argue with a line of config rather than
# with an absence.
protected-mode yes

port 6379

# How many connections may be queued by the kernel between `accept()` calls.
# 511 is Redis's default and matches the typical `somaxconn`; raising it without
# also raising the host's net.core.somaxconn does nothing.
tcp-backlog 511

# Send TCP keepalives every 300s on idle connections.
#
# This is what detects a peer that vanished without a FIN — a container killed
# with SIGKILL, a NAT table that dropped the mapping, a network partition.
# Without it those connections stay in Redis's client list forever, consuming a
# slot from `maxclients` and, for a pub/sub subscriber, a per-client output
# buffer. This is the server-side half of the dead-connection story; the
# client-side half is `health_check_interval` in backend/infrastructure/redis_client.py.
tcp-keepalive 300

# Never close an idle client connection.  ← READ THIS BEFORE CHANGING IT
#
# The tempting value is something like 300, to reap leaked connections. It is a
# trap in this deployment, and specifically a Pub/Sub trap: a subscriber that is
# working perfectly is, by definition, idle — it holds an open connection and
# sends nothing for as long as no event is published. A non-zero `timeout` would
# disconnect exactly the healthy, quiet subscribers, and on a slow market day
# the realtime fan-out would flap continuously. The backend now reconnects
# automatically (infrastructure/redis_pubsub.py), so the symptom would be
# invisible in logs and visible only as reconnect churn on the metrics.
#
# Leaked connections are bounded by `maxclients` below and by the client-side
# connection pool, which is where that problem actually belongs.
timeout 0

# Explicitly disabled administrative surface. All three default to `no`; they are
# written out because they are the exact primitives that turn "read access to
# Redis" into "arbitrary file write as the redis user", which is the standard
# path to an authorized_keys or a cron entry — i.e. remote code execution, not a
# cache leak. `enable-protected-configs no` is what blocks `CONFIG SET dir`.
#
# These can only be set here or on the command line. They are NOT reachable via
# CONFIG SET, by design, so an attacker holding the Redis password cannot turn
# them back on.
enable-protected-configs no
enable-debug-command no
enable-module-command no

# Hard ceiling on simultaneous client connections. Redis's default is 10000,
# which on a container with a modest memory limit is not a limit at all — each
# client costs a socket, an input buffer and (for subscribers) an output buffer,
# so 10000 clients can exhaust memory before `maxmemory` ever engages, and
# `maxmemory` does not account for client buffers.
#
# 512 is far above what this deployment needs: each backend replica opens at most
# REDIS_MAX_CONNECTIONS pool connections (default 24) plus one dedicated Pub/Sub
# connection. Even at 16 replicas that is ~400. Reaching this limit means either
# a connection leak or an unplanned scale-up, and both are things you want to
# find out about as a clear `-ERR max number of clients reached` rather than as
# an OOM kill.
maxclients 512

# ──────────────────────────────────────────────────────────────────────────────
# PERSISTENCE
#
# THE DECISION: AOF on, RDB off.
#
# Redis offers two persistence mechanisms and most deployments run both. This one
# runs only the append-only file, for a reason specific to what is stored here.
#
# What lives in this Redis: market-data cache entries (reconstructible from the
# provider APIs) and transient Pub/Sub traffic (not stored at all). Nothing here
# is a system of record — sessions, rate-limit counters and audit logs are all in
# MongoDB precisely because they must be durable (see backend/security/sessions.py).
#
# So why persist anything? Not for durability — for RESTART BEHAVIOUR. Without
# persistence, every Redis restart empties the cache, and every backend replica
# simultaneously re-fetches the entire quote universe from Alpha Vantage and
# Yahoo at once. That is a self-inflicted thundering herd against rate-limited
# third-party APIs, and it turns a 2-second Redis restart into several minutes of
# degraded market data. Persistence here is a warm-start optimization.
#
# Given that framing, AOF beats RDB clearly: AOF loses at most one second of
# writes, RDB loses everything since the last snapshot (potentially minutes of
# warm cache). And running BOTH would mean two processes forking and writing to
# the same volume for a benefit — belt-and-braces durability — that does not
# apply to reconstructible data.
# ──────────────────────────────────────────────────────────────────────────────

dir /data

# RDB snapshots off. `save ""` is the documented way to disable them; an empty
# `save` list, not a commented-out one, because Redis applies built-in defaults
# (3600/300/60) when no `save` directive appears at all. Omitting the line would
# silently leave RDB enabled — the opposite of the intent.
save ""

# Irrelevant while RDB is off, but set anyway so that if someone re-enables `save`
# they do not also inherit the default behaviour of refusing all writes when a
# background save fails. For a cache, refusing writes because a snapshot failed
# converts a persistence problem into an availability problem.
stop-writes-on-bgsave-error no

# Do not compress or checksum RDB payloads — with RDB disabled these apply only
# to the RDB preamble of the AOF, where the CPU cost is paid on every rewrite and
# the AOF already lives on a local volume with its own integrity guarantees.
# Defaults kept explicit rather than tuned; changing them is not a win worth the
# risk of an unreadable AOF preamble.
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# fsync once per second, not on every write.
#
# The three options are `always` (fsync every command — safe, and roughly an
# order of magnitude slower, because every write waits on the disk), `everysec`
# (a background thread fsyncs once a second — at most 1s of writes lost) and `no`
# (leave it to the OS — can lose 30s+). For reconstructible cache data whose
# persistence exists to avoid a cold start, `always` buys durability nobody is
# asking for at a latency cost paid on every single cache write. `everysec` is
# the right point on that curve and is Redis's own recommended default.
appendfsync everysec

# During an AOF rewrite, keep fsyncing.
#
# Setting this to `yes` avoids a latency spike caused by fsync contending with
# the rewrite's disk I/O — at the cost of a window (up to the whole rewrite)
# where writes are not durable at all. On a container volume the rewrite of a
# ≤256 MB dataset is short, and a predictable small cost beats an unbounded
# durability hole.
no-appendfsync-on-rewrite no

# Rewrite the AOF when it has doubled in size, but never below 64 MB.
#
# The AOF is a log of every write, so with a cache that constantly SETs and
# expires keys it grows without bound while the actual dataset stays flat. The
# rewrite compacts it back to "the minimum command set that reproduces the current
# data". These are Redis's defaults, restated because they are load-bearing here
# and because the failure mode of getting them wrong is quiet: too aggressive and
# the process forks constantly (each fork briefly doubles memory); too lax and a
# 256 MB dataset carries a multi-gigabyte AOF that makes restarts slow — the exact
# thing persistence was enabled to avoid.
#
# ⚠ MEMORY HEADROOM: a rewrite forks, and the child's copy-on-write pages mean
# peak RSS can approach 2× `maxmemory` on a write-heavy workload. Size the
# container's memory limit at ≥2× REDIS_MAXMEMORY, or an AOF rewrite becomes an
# OOM kill — which is a *worse* outcome than no persistence, because it also
# truncates the AOF it was rewriting.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Write an RDB-format preamble at the head of each rewritten AOF. Loading a
# binary snapshot plus a short command tail is dramatically faster than replaying
# a full command log — this is what keeps restart time in the low seconds. Redis
# 7 defaults this on; it is stated because restart time is the entire point of
# enabling persistence here.
aof-use-rdb-preamble yes

# Tolerate a truncated final AOF entry on load (the normal shape of an
# ungraceful kill: the last write was partially flushed). Redis logs a warning,
# discards the partial command and starts. The alternative — refusing to start —
# would mean a `docker kill` during a deploy leaves Redis permanently unbootable
# until an operator runs redis-check-aof, for the sake of one lost cache entry.
aof-load-truncated yes

# ──────────────────────────────────────────────────────────────────────────────
# MEMORY MANAGEMENT
#
# `maxmemory` and `maxmemory-policy` are supplied on the COMMAND LINE from
# REDIS_MAXMEMORY / REDIS_MAXMEMORY_POLICY (defaults 256mb / allkeys-lru), so
# they can differ per environment. They are not set here — see the header.
#
# On the policy choice: `allkeys-lru` is correct *because* of what is stored.
# Everything in this instance is reconstructible, so evicting a cold key is
# always better than refusing a write. The default policy, `noeviction`, would
# make a full Redis start returning OOM errors on every SET — which
# services/cache.py handles gracefully (it falls back to its in-process dict),
# but which would silently disable the shared cache across every replica.
#
# `volatile-lru` would be the choice if this instance also held keys that must
# never be evicted. It does not, and if it ever does, that data belongs in
# MongoDB instead — mixing evictable and non-evictable data in one Redis is how
# you discover, during an incident, which of the two your code assumed.
# ──────────────────────────────────────────────────────────────────────────────

# Sample 5 keys per eviction to approximate LRU. Redis's LRU is approximate by
# design — exact LRU needs a linked list per key and the memory for it. 5 is the
# default and is within ~2% of exact LRU; 10 halves the error at roughly double
# the eviction CPU. Not worth it for cache entries whose miss cost is one HTTP
# fetch that was going to happen soon anyway.
maxmemory-samples 5

# Free memory on a background thread instead of blocking the event loop.
#
# Redis is single-threaded for command execution, so `DEL` of a large value —
# or an eviction, or an expiry — blocks EVERY other client for the duration of
# the free(). At 256 MB with mostly small JSON values this is microseconds, but
# the market-data cache does store multi-megabyte universe snapshots, and one
# eviction of one of those is a multi-millisecond stall for every connected
# replica simultaneously. Lazy freeing moves that work off the hot path. There is
# no meaningful downside; it is off by default only for backwards compatibility.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# ──────────────────────────────────────────────────────────────────────────────
# PUB/SUB
# ──────────────────────────────────────────────────────────────────────────────

# Disconnect a Pub/Sub subscriber whose output buffer exceeds 32 MB, or stays
# above 8 MB for 60 seconds.
#
# THIS IS THE MOST IMPORTANT LINE IN THE FILE FOR REALTIME CORRECTNESS, and the
# reason infrastructure/redis_pubsub.py exists in the shape it does.
#
# Redis Pub/Sub is fire-and-forget with NO backpressure: the publisher never
# waits for subscribers. If a subscriber stops reading — a backend replica whose
# event loop is blocked, a GC pause, a network stall — the server buffers
# messages for it in memory. Without a limit, one stuck subscriber makes Redis
# consume unbounded memory on its behalf and eventually take down the whole
# instance for everyone. The limit converts that into a bounded, local failure:
# the slow subscriber is dropped and everyone else keeps working.
#
# The corollary is what most implementations get wrong: BEING DISCONNECTED IS
# NORMAL OPERATION, not an exceptional error. A subscriber that does not
# reconnect automatically will silently stop receiving events after its first
# hiccup, and nothing will look broken — no exception, no failed request, just
# WebSocket clients on that replica that quietly stop getting updates. That is
# exactly the failure PH2.7 fixes; the reconnect loop and the
# `redis_pubsub_reconnects_total` metric both exist because of this line.
#
# These are Redis's defaults. They are restated here so the reasoning is on the
# record, not because they needed changing.
client-output-buffer-limit pubsub 32mb 8mb 60
client-output-buffer-limit normal 0 0 0

# Keyspace notifications off (Redis's default). They publish an event to a
# Pub/Sub channel on every key mutation, which for a high-churn cache is a large
# multiple of the application's own traffic — for a feature this codebase does
# not use. Turn on only the specific classes needed, never `KEA`.
notify-keyspace-events ""

# ──────────────────────────────────────────────────────────────────────────────
# OBSERVABILITY
# ──────────────────────────────────────────────────────────────────────────────

# Log to stdout so the Docker logging driver captures it. `logfile ""` means
# stdout; writing to a file inside the container would put Redis's logs somewhere
# `docker logs` cannot see and nothing rotates. See the x-logging anchor in
# docker-compose.yml.
logfile ""
loglevel notice

# Record any command taking longer than 10 ms, keeping the last 256.
#
# Redis commands are microsecond-scale; 10 ms means something pathological — a
# `KEYS` in production code, a huge value being serialized, a fork stall. The
# default retains 128 entries, which on a busy instance is minutes of history.
# 256 costs a few kilobytes and is the difference between "the slowlog covers the
# incident" and "the slowlog rolled over while you were reading the alert".
#
#     docker compose exec redis redis-cli SLOWLOG GET 10
slowlog-log-slower-than 10000
slowlog-max-len 256

# Track operations that block the event loop for more than 100 ms, exposed via
# `LATENCY HISTORY` / `LATENCY DOCTOR`. Off by default (threshold 0). The cost is
# a timestamp comparison per event; the benefit is that when p99 cache latency
# spikes, `LATENCY DOCTOR` names the cause (fork, expire cycle, eviction) instead
# of leaving you to guess.
#
#     docker compose exec redis redis-cli LATENCY DOCTOR
latency-monitor-threshold 100

# ──────────────────────────────────────────────────────────────────────────────
# THREADING
# ──────────────────────────────────────────────────────────────────────────────

# Single I/O thread — Redis's default, and deliberately not raised.
#
# `io-threads` parallelizes only socket read/write, never command execution, so
# it helps exactly one workload: many clients moving large values, saturating a
# CPU core on syscalls. This deployment has tens of connections moving small JSON
# documents and is nowhere near that. Raising it adds thread-coordination
# overhead and, on a container limited to one or two CPUs, actively hurts.
#
# Revisit only with evidence: `INFO commandstats` showing high `usec_per_call` on
# trivial commands, plus the redis process pinned at 100% of a core.
io-threads 1

# ──────────────────────────────────────────────────────────────────────────────
# NOT SET, ON PURPOSE — and why
#
#   replicaof / replica-*      No replication. Out of scope for PH2.7 (single
#                              node). See docs/infrastructure/REDIS.md §Failover
#                              for the migration path.
#   cluster-enabled            No Redis Cluster. Explicitly out of scope; the
#                              keyspace is small and a single node is the right
#                              answer until it is not.
#   requirepass                A credential. Command line / Docker secret only.
#   user / ACL                 Redis 6+ ACLs would let the backend hold a token
#                              that cannot run CONFIG or FLUSHALL — a genuine
#                              improvement over one shared password, and the
#                              natural follow-up once there is more than one
#                              consumer of this instance. One consumer today
#                              means one credential; adding an ACL file now would
#                              be ceremony without a boundary.
#   appendfsync always         See PERSISTENCE above.
#   activedefrag               Active defragmentation is a real fix for a real
#                              problem (fragmentation ratio > 1.5 on a long-lived
#                              instance with variable value sizes) and a
#                              significant CPU cost otherwise. Enable it in
#                              response to `INFO memory`'s mem_fragmentation_ratio,
#                              not in anticipation.
# ──────────────────────────────────────────────────────────────────────────────
