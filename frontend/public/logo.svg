<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#18181B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border -->
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Chart bars representing market data -->
  <g filter="url(#glow)">
    <!-- Rising price bars -->
    <rect x="80" y="340" width="44" height="96" rx="6" fill="url(#accent)" opacity="0.5"/>
    <rect x="140" y="300" width="44" height="136" rx="6" fill="url(#accent)" opacity="0.65"/>
    <rect x="200" y="260" width="44" height="176" rx="6" fill="url(#accent)" opacity="0.75"/>
    <rect x="260" y="210" width="44" height="226" rx="6" fill="url(#accent)" opacity="0.85"/>
    <rect x="320" y="160" width="44" height="276" rx="6" fill="url(#accent)"/>
    <rect x="380" y="120" width="44" height="316" rx="6" fill="url(#accent)"/>
    <!-- Trend line overlay -->
    <polyline points="102,340 162,300 222,258 282,208 342,158 402,118"
      stroke="#818CF8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Data points -->
    <circle cx="102" cy="340" r="7" fill="#818CF8"/>
    <circle cx="162" cy="300" r="7" fill="#818CF8"/>
    <circle cx="222" cy="258" r="7" fill="#818CF8"/>
    <circle cx="282" cy="208" r="7" fill="#818CF8"/>
    <circle cx="342" cy="158" r="7" fill="#818CF8"/>
    <circle cx="402" cy="118" r="9" fill="#A5B4FC"/>
  </g>
  <!-- "α" Alpha symbol in top-right area, subtle -->
  <text x="348" y="88" font-family="Georgia, serif" font-size="72" font-weight="bold"
    fill="#6366F1" opacity="0.25">α</text>
</svg>
