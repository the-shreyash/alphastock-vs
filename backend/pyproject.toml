# ==============================================================================
# StockAssist AI — backend tool configuration (PH2.4)
#
# WHY THIS FILE EXISTS
# --------------------
# Before this sprint, "run the tests" and "run the linter" meant whatever the
# engineer typed. CI cannot be built on a convention that lives in someone's
# shell history: a pipeline that selects tests differently from the developer
# who wrote them will disagree with that developer, and the disagreement will
# always be discovered at the worst possible moment. This file makes the
# invocation the SAME everywhere — `pytest`, `black`, `isort` and `mypy` read it
# whether they are started by a human in backend/ or by a GitHub Actions runner.
#
# NOT a packaging manifest. There is deliberately no [build-system] and no
# [project] table: the backend is deployed as a container image built from
# source (backend/Dockerfile), not as an installable wheel. Adding those tables
# would invite `pip install .` and create a second, competing description of the
# dependency set that would drift from requirements.txt.
#
# flake8 is configured separately in .flake8 — it is the one tool in this set
# that still refuses to read pyproject.toml (upstream issue, open since 2018).
# ==============================================================================

# ------------------------------------------------------------------------------
# pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

# --strict-markers turns a typo'd marker into a collection ERROR instead of a
# silently-ignored decorator. Without it, `@pytest.mark.integraton` (one letter
# wrong) means the test quietly runs in the "not integration" selection — which
# is precisely the failure mode this config exists to prevent.
# -ra prints a short reason for every non-passing outcome at the end of the run,
# so a CI log answers "what was skipped and why?" without re-running verbosely.
#
# `-m "not integration"` (PH3.1) makes the BARE `pytest` command deterministic.
# Before this line, plain `pytest` collected the live-server suites too and
# reported 47 failures + 51 errors on any machine without a running backend —
# so the default command was one nobody could use, and "the tests are red" had
# stopped meaning anything. pytest applies addopts BEFORE the command line, and
# `-m` is single-valued, so an explicit `pytest -m integration` still overrides
# this cleanly. See docs/testing/TEST_ARCHITECTURE.md for the full command set.
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not integration",
]

# Marker taxonomy (PH3.1).
#
# Only `integration` is load-bearing for selection today — every GitHub Actions
# workflow selects with `-m "not integration"`, and `tests/conftest.py` applies
# it mechanically to the live-server suites. The rest are declarative: they
# describe what a test needs so that a future CI job can provision it, and they
# are registered here so `--strict-markers` accepts them instead of turning a
# correct annotation into a collection error.
#
# Deliberately NOT added: a `unit` marker. It would have to be hand-applied to
# ~1000 existing tests to mean anything, and a marker that is missing from most
# of the tests it describes is worse than no marker — `-m unit` would silently
# run a fraction of the suite and look green. "Hermetic" is the default and is
# defined by the ABSENCE of the markers below, which needs no annotation and
# cannot drift.
markers = [
    "integration: requires a live backend server at $REACT_APP_BACKEND_URL (and, transitively, MongoDB, Redis and network access to real market-data providers). Excluded from the default selection via `-m 'not integration'` in addopts. Applied automatically by tests/conftest.py to the legacy `requests`-based suites — do not hand-apply it.",
    "live: drives a running deployment over HTTP/WebSocket rather than an in-process TestClient. Applied automatically alongside `integration` by tests/conftest.py. Implies the outbound-network guard is not installed.",
    "e2e: exercises a complete user journey across the running stack. No test carries this yet — PH3.9 owns the journeys.",
    "security: a PH1 security-control regression test (auth, cookies, CORS, JWT, sessions, password policy, rate limiting, CSRF, headers, RBAC, audit). Hermetic; included in the default run. Applied automatically by tests/conftest.py from the file list in `_SECURITY_SUITES`.",
    "slow: takes more than ~5 seconds. Included in the default run; `-m 'not slow'` gives a fast inner-loop selection.",
    "requires_db: needs a real MongoDB. No hermetic test carries this — the `fake_db` fixture exists so none has to. Reserved for the PH2.6 integration job.",
    "requires_redis: needs a real Redis. No hermetic test carries this — the Redis suites drive `RedisSettings`/client construction without connecting. Reserved for the PH2.6 integration job.",
    "allow_network: this test is deliberately exempt from the hermetic outbound-network guard. Requires a comment at the test explaining why.",
]

# Third-party deprecation noise (FastAPI's on_event, starlette's per-request
# cookies, aiohttp inheritance) is filtered so a real warning from OUR code is
# visible in the CI log rather than buried under ten known ones. Deliberately
# NOT `filterwarnings = ["error"]`: promoting every warning to a failure would
# make an upstream release able to break this pipeline overnight.
filterwarnings = [
    "default",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::PendingDeprecationWarning:starlette.*",
]

# ------------------------------------------------------------------------------
# black
#
# 120 rather than black's default 88. The default is a good choice for a fresh
# codebase; this one is 250k lines old and written to a wider column, and
# re-wrapping it to 88 would be a diff nobody can review. 120 matches the width
# the code is already written to, so the eventual formatting commit is as small
# as it can be. See docs/deployment/GITHUB_ACTIONS.md §6 for why `black --check`
# is advisory today and what has to happen before it becomes a merge gate.
# ------------------------------------------------------------------------------
[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(
    venv
  | \.venv
  | __pycache__
  | \.pytest_cache
)/
'''

# ------------------------------------------------------------------------------
# isort
#
# profile = "black" is not optional when both tools run: without it isort's
# default multi-line style and black's disagree, each reformats what the other
# just wrote, and `--check` fails forever no matter how many times you run them.
# ------------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["venv/*", ".venv/*", "**/__pycache__/*"]
known_first_party = ["security", "services", "server", "models", "tests", "scripts"]

# ------------------------------------------------------------------------------
# mypy
#
# Scoped to backend/security/ and backend/analytics/. **10 findings, all
# pre-existing and none in either package**: mypy follows imports, and
# `security` reaches into `observability` (PH3.7), which is not annotated and is
# not in `files`. `mypy security` alone reported the same 10 before PH3.8 added
# `analytics`, which contributes zero. Type-checking the
# whole backend today would emit thousands of errors against a codebase written
# without annotations, and an error list nobody reads is not a quality gate.
# The security package is the right first perimeter: it is the newest code, the
# most annotated, and the code where a type confusion has the highest cost.
# Expand the `files` list as packages are annotated.
#
# PH3.8 adds `analytics` — clean at this setting on the day it was written, and
# added on that day precisely because a perimeter is cheap to hold and expensive
# to reclaim. The three findings it surfaced were all real Optional-narrowing
# gaps in code whose whole purpose is to distinguish "no value" from zero, which
# is the argument for having it here rather than a coincidence.
# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["security", "analytics"]
ignore_missing_imports = true          # no stubs published for motor/litellm/etc.
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
exclude = "(venv|\\.venv|__pycache__)/"

# ------------------------------------------------------------------------------
# coverage (PH3.1)
#
# Deliberately NOT enabled in pytest's addopts. Coverage instrumentation costs
# roughly a quarter of the suite's wall-clock, and the inner-loop command has to
# stay fast or people stop running it. `pytest --cov` opts in; CI can do the
# same when a coverage job exists (none does yet — see docs/testing/
# TEST_ARCHITECTURE.md §Coverage).
#
# `source` is the application code only. Measuring the tests themselves inflates
# the headline number by ~13 points (72% including tests vs 59% for application
# code on the PH3.1 baseline) — the more flattering figure being the meaningless
# one, since test files are ~100% covered by construction.
#
# No `fail_under`. PH3.1's job is to establish an honest baseline; a threshold
# invented in the same commit as the first measurement is a number pulled from
# the air, and the first person it blocks will simply lower it.
# ------------------------------------------------------------------------------
# `source = ["."]` plus an omit list, NOT a list of the packages to measure.
# coverage resolves `source` entries as package names or directories — a plain
# file path like "server.py" is silently ignored, which would have dropped the
# single largest module (2,897 statements) out of the denominator and reported
# a headline number ~8 points too high. Measuring everything and subtracting
# what we mean to exclude fails loudly instead: a new package is included by
# default rather than forgotten.
[tool.coverage.run]
source = ["."]
omit = [
    "*/venv/*",
    "*/.venv/*",
    "*/__pycache__/*",
    "tests/*",
    "scripts/*",
    "docker/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    # Import-time guards and typing-only branches are not behaviour.
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
