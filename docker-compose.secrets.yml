# ==============================================================================
# StockAssist AI — Docker Secrets overlay (PH2.3)
#
# WHAT THIS FILE IS
# -----------------
# An OPT-IN overlay that moves credentials out of environment variables and into
# file-mounted Docker secrets. It is applied on top of the base stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# Note that this composes with `-f docker-compose.yml`, the EXPLICIT production
# path — so the developer override (Mongo Express, published DB ports) is not
# merged in. That is deliberate: secret-file delivery is a production posture,
# and rehearsing it should rehearse the production stack.
#
# WHY IT IS AN OVERLAY AND NOT A REWRITE OF THE BASE FILE
# -------------------------------------------------------
# Two reasons, both about adoption rather than taste:
#
#   1. The base stack must keep working. An operator with a filled-in
#      production.env should be able to pull this change and `up -d` with no
#      action required. A migration that breaks every existing deployment on
#      upgrade gets reverted, not adopted.
#   2. Secrets need somewhere to come from. Docker's file-based secrets require
#      the files to exist on the host before `up` — so this path has a
#      prerequisite (`./secrets/generate.sh`) that the base path does not. Making
#      it explicit at the command line makes that prerequisite visible.
#
# WHAT THIS ACTUALLY BUYS YOU
# ---------------------------
#   ✓ `docker inspect stockassist-backend` no longer prints JWT_SECRET,
#     MONGO_URL, or any AI provider key. It prints `JWT_SECRET_FILE=/run/secrets/
#     jwt_secret` — a path, not a credential.
#   ✓ The values are not in the container's environment, so they are not
#     inherited by any child process and are not in /proc/<pid>/environ.
#   ✓ Under Swarm (`docker stack deploy`) the same file works unchanged, and the
#     secrets live in the encrypted Raft store and are mounted from tmpfs —
#     never written to any node's disk.
#   ✗ In plain Compose (not Swarm) the secret files ARE plaintext on the host
#     disk under ./secrets/. This overlay narrows the exposure from "anything
#     that can read container metadata" to "anything that can read those files";
#     it does not eliminate it. Full elimination needs Swarm, Kubernetes, or a
#     cloud secret manager — see docs/deployment/SECRETS.md §7.
#
# HOW THE BACKEND CONSUMES THEM
# -----------------------------
# `backend/security/secrets.py` (PH2.3) resolves `<NAME>_FILE` pointers and
# auto-discovers `/run/secrets/<name>` before anything reads configuration. The
# `_FILE` variables below are therefore the ONLY wiring required — no application
# code knows this file exists.
#
# Full documentation: docs/deployment/SECRETS.md
# ==============================================================================

services:

  backend:
    environment:
      # ── Pointers, not values ────────────────────────────────────────────────
      # These OVERRIDE the composed plaintext values in docker-compose.yml,
      # because Compose merges `environment:` maps key-by-key and a later file
      # wins. The base file's MONGO_URL / REDIS_URL are still set — which would
      # be a two-source conflict that security/secrets.py rejects — so they are
      # explicitly unset below.
      MONGO_URL_FILE: /run/secrets/mongo_url
      REDIS_URL_FILE: /run/secrets/redis_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret

      # ── Retractions ─────────────────────────────────────────────────────────
      # These three are set by docker-compose.yml (MONGO_URL, REDIS_URL) or by
      # production.env (JWT_SECRET). Left in place they would be a SECOND source
      # for a secret that now comes from a file, and security/secrets.py refuses
      # to boot on that — correctly, because guessing which of two values is the
      # current one is how a rotated secret gets silently shadowed by a stale one.
      #
      # An explicit empty string is the retraction, NOT null (`~`). They are not
      # equivalent: `MONGO_URL: ~` means "inherit from whatever the host shell
      # has", so an operator with MONGO_URL exported in their terminal would have
      # it injected into the container. `""` is unconditional — the loader treats
      # a blank value as absent, so exactly one source (the file) remains, on
      # every machine regardless of the invoking shell.
      #
      # Both override `env_file`, so an unmodified production.env keeps working:
      # there is no need to edit it when migrating a secret to a file.
      MONGO_URL: ""
      REDIS_URL: ""
      JWT_SECRET: ""

      # Everything else (AI keys, OAuth, broker, email) is auto-discovered from
      # /run/secrets/<name> by the loader — no `_FILE` variable needed for any
      # secret whose name is in SECRET_REGISTRY. Mount one below and it is picked
      # up; leave it out and the value falls back to production.env as before.
      # That is what makes this a gradual migration rather than a big-bang one.

      # Turn every remaining plaintext SENSITIVE secret into a boot failure. Off
      # by default because it must only be switched on once a deployment has
      # finished migrating — see docs/deployment/SECRETS.md §5. With it on, this
      # stack will refuse to start while ANTHROPIC_API_KEY still comes from
      # production.env.
      # REQUIRE_FILE_SECRETS: "true"

    secrets:
      # Compose mounts each of these read-only at /run/secrets/<name>, owned by
      # root, mode 0444. World-readable inside the container looks alarming and
      # is not: the container's threat model is the host and other containers,
      # both of which are outside this mount namespace. Making it 0400 root-only
      # would in fact BREAK it, because the backend runs as uid 10001.
      - mongo_url
      - redis_url
      - jwt_secret
      # Uncomment as you migrate each one out of production.env. The name must
      # match the environment variable, lowercased — that is what makes
      # auto-discovery work without any further wiring.
      # - anthropic_api_key
      # - google_gemini_key
      # - csrf_secret
      # - recovery_secret
      # - broker_token_key
      # - webhook_api_key

  mongo:
    environment:
      # The official mongo image has supported the `_FILE` convention natively
      # since 4.x — this is where the convention we adopted for the backend comes
      # from. The empty-string retraction below removes the base file's plaintext
      # variable for the same one-source reason as above; here it matters even
      # more, because the ROOT password is the credential that can drop every
      # database. (The upstream entrypoint rejects having both forms set.)
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_username
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""

      # ⚠ MONGO_APP_USERNAME / MONGO_APP_PASSWORD stay as environment variables.
      # They are read by docker/mongodb/init-app-user.js, which runs under
      # mongosh and can only reach `process.env` — it has no filesystem access to
      # read a mounted secret. Reworking that would mean generating the init
      # script at runtime from a shell wrapper, which trades a real, documented
      # exposure for a fragile one. The exposure is bounded: this pair is only
      # consumed on FIRST initialization of an empty volume, and the account it
      # creates has `readWrite` on one database and nothing else. Tracked as
      # limitation L2 in docs/deployment/SECRETS.md §8.

    secrets:
      - mongo_root_username
      - mongo_root_password

  redis:
    # The official redis image has no `_FILE` support and no way to read
    # `requirepass` from a separate file — a real gap in the upstream image, not
    # an oversight here. The wrapper below is the standard workaround:
    #
    #   * `sh -c` reads the secret at container start and passes it to
    #     redis-server, so the password is no longer in the compose file, no
    #     longer in `docker inspect`'s Cmd, and no longer in the service's
    #     environment.
    #   * `exec` replaces the shell so redis-server keeps PID 1 and still
    #     receives SIGTERM directly — the AOF is flushed cleanly on shutdown,
    #     exactly as in the base stack.
    #
    # ⚠ WHAT THIS DOES NOT FIX: the expanded password is in redis-server's argv,
    # so it is visible in `ps` output *inside this container*. That is a strictly
    # smaller surface than `docker inspect` (which any host user in the docker
    # group can read) but it is not zero. Closing it entirely requires generating
    # a redis.conf at startup; see docs/deployment/SECRETS.md §8, limitation L3.
    command:
      - sh
      - -c
      - |
        set -eu
        REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --appendonly yes \
          --appendfsync everysec \
          --save "" \
          --maxmemory "$${REDIS_MAXMEMORY:-256mb}" \
          --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"

    environment:
      # `$$` above escapes the dollar sign so COMPOSE leaves it alone and the
      # SHELL expands it at runtime. A single `$` would make Compose interpolate
      # it at parse time — from the host's .env — which is the exact leak this
      # overlay exists to prevent.
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
      REDIS_MAXMEMORY_POLICY: ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      # The healthcheck's redis-cli reads REDISCLI_AUTH. It cannot read the
      # secret file itself (healthchecks run as a bare exec, not through a
      # shell), so this one value is still delivered as an environment variable.
      # It is the same password, so no new secret is exposed — but it does mean
      # `docker inspect stockassist-redis` still shows it. Tracked as L3.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env — see compose.env.example}

    secrets:
      - redis_password

# ==============================================================================
# SECRET DEFINITIONS
#
# `file:` reads from the host at `up` time. Under Swarm the same names resolve to
# `external: true` secrets held in the encrypted Raft store — which is why the
# service-level wiring above needs no change to move from Compose to Swarm:
#
#     docker secret create jwt_secret ./secrets/jwt_secret
#     # then swap the definitions below for:  jwt_secret: { external: true }
#
# Generate all of these with:  ./secrets/generate.sh
# ==============================================================================
secrets:
  mongo_url:
    file: ./secrets/mongo_url
  redis_url:
    file: ./secrets/redis_url
  jwt_secret:
    file: ./secrets/jwt_secret
  mongo_root_username:
    file: ./secrets/mongo_root_username
  mongo_root_password:
    file: ./secrets/mongo_root_password
  redis_password:
    file: ./secrets/redis_password

  # Uncomment alongside the matching `secrets:` entry on the backend service.
  # anthropic_api_key:
  #   file: ./secrets/anthropic_api_key
  # google_gemini_key:
  #   file: ./secrets/google_gemini_key
  # csrf_secret:
  #   file: ./secrets/csrf_secret
  # recovery_secret:
  #   file: ./secrets/recovery_secret
  # broker_token_key:
  #   file: ./secrets/broker_token_key
  # webhook_api_key:
  #   file: ./secrets/webhook_api_key
