version: "3.9"

services:
  # ── MongoDB ─────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: alphapartner_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: alpha_stock_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphapartner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Database
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: alpha_stock_db

      # Security — no baked-in fallback. Compose fails fast if JWT_SECRET is unset
      # (generate: python -c "import secrets;print(secrets.token_urlsafe(48))").
      # Boot-time validation in security/secrets.py rejects weak/short values.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in a local .env (see backend/.env.example)}
      APP_ENV: ${APP_ENV:-development}

      # AI Providers (dual-model debate architecture)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GEMINI_KEY: ${GOOGLE_GEMINI_KEY:-}

      # Zerodha (optional — enables live trading)
      KITE_API_KEY: ${KITE_API_KEY:-}
      KITE_API_SECRET: ${KITE_API_SECRET:-}

      # WhatsApp notifications (optional — Twilio)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-+14155238886}
      USER_WHATSAPP_TO: ${USER_WHATSAPP_TO:-}

      # Email notifications (optional — choose one)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-alerts@alphapartner.ai}

      # Market data (optional — Alpha Vantage for intraday data)
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}

      # Google OAuth (optional — enables "Continue with Google" button)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload

  # ── Frontend (React) ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: http://localhost:8000
        REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: alphapartner_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
      REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  # ── n8n (Automation Workflows) ───────────────────────────────────
  n8n:
    image: n8nio/n8n:1.70.0
    container_name: alphapartner_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    depends_on:
      - backend
    environment:
      # Basic auth for the n8n editor UI. No hard-coded credential: the password
      # is externalized and required (compose fails fast if it is unset).
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required — set it in a local .env}
      # Run workflow crons in IST so schedules match NSE market hours
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Reach the backend over the compose network
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  mongo_data:
    driver: local
  n8n_data:
    driver: local
